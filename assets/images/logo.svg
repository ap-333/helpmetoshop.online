<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HelpMeShop logo">
  <defs>
    <linearGradient id="hms-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#hms-grad)"/>

  <!-- Shopping bag outline -->
  <path d="M20 26 L22 18 Q22 15 25 15 L39 15 Q42 15 42 18 L44 26 L20 26 Z"
        fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>

  <!-- Bag body -->
  <path d="M20 26 L22 48 Q22 50 24 50 L40 50 Q42 50 42 48 L44 26"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Handle -->
  <path d="M26 26 Q26 12 32 12 Q38 12 38 26"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Help icon (?) inside -->
  <g fill="white">
    <circle cx="32" cy="36" r="1.5"/>
    <path d="M31.5 31 Q31.5 29.5 32 28.5 Q32.5 27.5 33.5 27.5 Q34.5 27.5 35 28.5 Q35.5 29 35 30 L33.8 32"
          fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
</svg>

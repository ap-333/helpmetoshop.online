<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMeShop Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 60px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 60px;
      color: #1f2937;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 60px;
      margin-bottom: 100px;
    }

    .logo-box {
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-display {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }

    .logo-desc {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    .brand-section {
      margin-top: 80px;
      text-align: center;
    }

    .brand-section h2 {
      font-size: 20px;
      margin-bottom: 40px;
      color: #1f2937;
    }

    .brand-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: white;
      padding: 60px 40px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 400px;
      margin: 0 auto;
    }

    .brand-icon {
      width: 160px;
      height: 160px;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
    }

    .brand-tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #9ca3af;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HelpMeShop Logo System</h1>

    <div class="grid">
      <!-- Logo 1: Primary -->
      <div class="logo-box">
        <div class="logo-display">
          <svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#9333EA"/>
                <stop offset="100%" style="stop-color:#7E22CE"/>
              </linearGradient>
            </defs>

            <!-- Chat Bubble Shape -->
            <path d="M 30 20 Q 20 20 20 35 L 20 160 Q 20 180 40 190 L 80 220 L 100 190 L 200 190 Q 220 190 220 170 L 220 35 Q 220 20 210 20 Z" fill="url(#g1)"/>

            <!-- Smile Mouth -->
            <path d="M 80 110 Q 120 140 160 110" stroke="#1F2937" stroke-width="8" fill="none" stroke-linecap="round"/>

            <!-- Dots -->
            <circle cx="80" cy="160" r="7" fill="#1F2937"/>
            <circle cx="120" cy="160" r="7" fill="#1F2937"/>
            <circle cx="160" cy="160" r="7" fill="#1F2937"/>
          </svg>
        </div>
        <div class="logo-title">Chat Bubble</div>
        <div class="logo-desc">Customer engagement & support</div>
      </div>

      <!-- Logo 2: Alternate -->
      <div class="logo-box">
        <div class="logo-display">
          <svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#9333EA"/>
                <stop offset="100%" style="stop-color:#7E22CE"/>
              </linearGradient>
            </defs>

            <!-- Chat Bubble Shape -->
            <path d="M 30 20 Q 20 20 20 35 L 20 160 Q 20 180 40 190 L 80 220 L 100 190 L 200 190 Q 220 190 220 170 L 220 35 Q 220 20 210 20 Z" fill="url(#g2)"/>

            <!-- Smile Mouth -->
            <path d="M 80 110 Q 120 140 160 110" stroke="#1F2937" stroke-width="8" fill="none" stroke-linecap="round"/>

            <!-- Dots -->
            <circle cx="80" cy="160" r="7" fill="#1F2937"/>
            <circle cx="120" cy="160" r="7" fill="#1F2937"/>
            <circle cx="160" cy="160" r="7" fill="#1F2937"/>
          </svg>
        </div>
        <div class="logo-title">Message Icon</div>
        <div class="logo-desc">Direct messaging support 24/7</div>
      </div>

      <!-- Logo 3: With outline -->
      <div class="logo-box">
        <div class="logo-display">
          <svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#9333EA"/>
                <stop offset="100%" style="stop-color:#7E22CE"/>
              </linearGradient>
            </defs>

            <!-- Chat Bubble Shape -->
            <path d="M 30 20 Q 20 20 20 35 L 20 160 Q 20 180 40 190 L 80 220 L 100 190 L 200 190 Q 220 190 220 170 L 220 35 Q 220 20 210 20 Z" fill="url(#g3)"/>

            <!-- Smile Mouth -->
            <path d="M 80 110 Q 120 140 160 110" stroke="#1F2937" stroke-width="8" fill="none" stroke-linecap="round"/>

            <!-- Dots -->
            <circle cx="80" cy="160" r="7" fill="#1F2937"/>
            <circle cx="120" cy="160" r="7" fill="#1F2937"/>
            <circle cx="160" cy="160" r="7" fill="#1F2937"/>
          </svg>
        </div>
        <div class="logo-title">Happy Support</div>
        <div class="logo-desc">Friendly, helpful assistance</div>
      </div>
    </div>

    <!-- Brand Lockup -->
    <div class="brand-section">
      <h2>Brand Lockup</h2>
      <div class="brand-display">
        <svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
          <defs>
            <linearGradient id="gbrand" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#9333EA"/>
              <stop offset="100%" style="stop-color:#7E22CE"/>
            </linearGradient>
          </defs>

          <!-- Chat Bubble Shape -->
          <path d="M 30 20 Q 20 20 20 35 L 20 160 Q 20 180 40 190 L 80 220 L 100 190 L 200 190 Q 220 190 220 170 L 220 35 Q 220 20 210 20 Z" fill="url(#gbrand)"/>

          <!-- Smile Mouth -->
          <path d="M 80 110 Q 120 140 160 110" stroke="#1F2937" stroke-width="8" fill="none" stroke-linecap="round"/>

          <!-- Dots -->
          <circle cx="80" cy="160" r="7" fill="#1F2937"/>
          <circle cx="120" cy="160" r="7" fill="#1F2937"/>
          <circle cx="160" cy="160" r="7" fill="#1F2937"/>
        </svg>
        <div class="brand-name">HelpMeShop</div>
        <div class="brand-tagline">SHOPPING SUPPORT 24/7</div>
      </div>
    </div>
  </div>
</body>
</html>

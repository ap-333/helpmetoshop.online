<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMeShop Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      padding: 48px 16px;
      color: #1f2937;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { text-align: center; font-size: 26px; margin-bottom: 40px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .card.dark { background: #0f172a; }
    .card.wide { grid-column: 1 / -1; }
    .label { margin-top: 20px; font-size: 13px; color: #6b7280; letter-spacing: 1px; text-transform: uppercase; }
    .card.dark .label { color: #94a3b8; }
    .icon { width: 240px; height: auto; }
    .icon.lg { width: 320px; }
    .wordmark {
      font-family: 'Russo One', sans-serif;
      font-size: 64px;
      line-height: 1;
      color: #F97316;
      letter-spacing: 1px;
    }
    .slogan {
      font-family: 'Roboto', sans-serif;
      font-size: 34px;
      color: #2563EB;
      line-height: 1.1;
    }
    .card.dark .slogan { color: #5fb3d4; }
    .row { display: flex; align-items: center; gap: 20px; }
    .row .icon { width: 110px; }
    .row .wordmark { font-size: 40px; }
    .row .slogan { font-size: 20px; }
    @media (max-width: 480px) {
      .wordmark { font-size: 40px; }
      .slogan { font-size: 22px; }
      .icon.lg { width: 240px; }
      .row { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="hmsBag" gradientUnits="userSpaceOnUse" x1="162" y1="0" x2="843" y2="0">
        <stop offset="0" stop-color="#06B6D4"/>
        <stop offset="1" stop-color="#2563EB"/>
      </linearGradient>
      <linearGradient id="hmsDot" gradientUnits="userSpaceOnUse" x1="183" y1="0" x2="266" y2="0">
        <stop offset="0" stop-color="#06B6D4"/>
        <stop offset="1" stop-color="#2563EB"/>
      </linearGradient>
      <path id="hmsBagPath" d="M 405 280 L 816 280 Q 830 280 830.5 294 L 843 771 Q 843 787 828 787 L 388 787 Q 372 787 372.5 771 L 376 680 Q 377 660 388 647 Q 400 632 392 612 Q 384 597 365 597 L 315 597 A 30 30 0 0 1 315 537 L 398 537 A 30 30 0 0 0 398 477 L 285 477 A 30 30 0 0 1 285 417 L 435 417 A 30 30 0 0 0 435 357 L 192 357 A 30 30 0 0 1 192 297 L 386 297 Q 390 280 405 280 Z"/>
      <clipPath id="hmsBagClip"><use href="#hmsBagPath"/></clipPath>
      <symbol id="hmsIcon" viewBox="150 95 805 705">
        <path d="M 481.5 257 A 123.5 123.5 0 0 1 728.5 257" fill="none" stroke="#F97316" stroke-width="47"/>
        <path d="M 518 520 L 622 624 L 905 341" fill="none" stroke="#F97316" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
        <use href="#hmsBagPath" fill="url(#hmsBag)"/>
        <path d="M 518 520 L 622 624 L 905 341" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#hmsBagClip)"/>
        <rect x="183" y="537" width="83" height="60" rx="30" fill="url(#hmsDot)"/>
      </symbol>
    </defs>
  </svg>

  <div class="container">
    <h1>HelpMeShop Logo</h1>

    <div class="grid">
      <div class="card wide">
        <svg class="icon lg" viewBox="0 0 805 705" role="img" aria-label="HelpMeShop logo"><use href="#hmsIcon"/></svg>
        <div class="wordmark">HELPMESHOP</div>
        <div class="slogan">shopping support 24/7</div>
        <div class="label">Primary Lockup</div>
      </div>

      <div class="card">
        <svg class="icon" viewBox="0 0 805 705" role="img" aria-label="HelpMeShop icon"><use href="#hmsIcon"/></svg>
        <div class="label">Icon</div>
      </div>

      <div class="card dark">
        <svg class="icon" viewBox="0 0 805 705" role="img" aria-label="HelpMeShop icon on dark"><use href="#hmsIcon"/></svg>
        <div class="label">Icon on Dark</div>
      </div>

      <div class="card wide">
        <div class="row">
          <svg class="icon" viewBox="0 0 805 705" role="img" aria-label="HelpMeShop logo"><use href="#hmsIcon"/></svg>
          <div>
            <div class="wordmark">HELPMESHOP</div>
            <div class="slogan">shopping support 24/7</div>
          </div>
        </div>
        <div class="label">Horizontal Lockup</div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMeShop Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 60px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 60px;
      color: #1f2937;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 60px;
      margin-bottom: 100px;
    }

    .logo-box {
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-display {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }

    .logo-desc {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    .brand-section {
      margin-top: 80px;
      text-align: center;
    }

    .brand-section h2 {
      font-size: 20px;
      margin-bottom: 40px;
      color: #1f2937;
    }

    .brand-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: white;
      padding: 60px 40px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 400px;
      margin: 0 auto;
    }

    .brand-icon {
      width: 160px;
      height: 160px;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
    }

    .brand-tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #9ca3af;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HelpMeShop Logo System</h1>

    <div class="grid">
      <!-- Logo 1: Phone Icon -->
      <div class="logo-box">
        <div class="logo-display">
          <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FFA500"/>
                <stop offset="100%" style="stop-color:#FF6B6B"/>
              </linearGradient>
            </defs>

            <!-- Shopping Bag Body -->
            <path d="M 60 90 L 50 100 Q 45 110 45 130 L 45 230 Q 45 250 60 260 L 140 260 Q 155 250 155 230 L 155 130 Q 155 110 150 100 L 140 90 Z" fill="url(#g1)"/>

            <!-- Handles -->
            <path d="M 75 90 Q 70 50 100 35 Q 130 50 125 90" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Icon Circle -->
            <circle cx="100" cy="155" r="48" fill="none" stroke="white" stroke-width="5"/>

            <!-- Checkmark Icon -->
            <g transform="translate(100, 155)">
              <path d="M -22 3 L -8 22 L 26 -14" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        <div class="logo-title">Phone Icon</div>
        <div class="logo-desc">Direct call-to-action support</div>
      </div>

      <!-- Logo 2: Checkmark Icon -->
      <div class="logo-box">
        <div class="logo-display">
          <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FFA500"/>
                <stop offset="100%" style="stop-color:#FF6B6B"/>
              </linearGradient>
            </defs>

            <!-- Shopping Bag Body -->
            <path d="M 60 90 L 50 100 Q 45 110 45 130 L 45 230 Q 45 250 60 260 L 140 260 Q 155 250 155 230 L 155 130 Q 155 110 150 100 L 140 90 Z" fill="url(#g2)"/>

            <!-- Handles -->
            <path d="M 75 90 Q 70 50 100 35 Q 130 50 125 90" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Icon Circle -->
            <circle cx="100" cy="155" r="48" fill="none" stroke="white" stroke-width="5"/>

            <!-- Checkmark Icon -->
            <g transform="translate(100, 155)">
              <path d="M -22 3 L -8 22 L 26 -14" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        <div class="logo-title">Checkmark Icon</div>
        <div class="logo-desc">Problem resolved messaging</div>
      </div>

      <!-- Logo 3: Headset Icon -->
      <div class="logo-box">
        <div class="logo-display">
          <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FFA500"/>
                <stop offset="100%" style="stop-color:#FF6B6B"/>
              </linearGradient>
            </defs>

            <!-- Shopping Bag Body -->
            <path d="M 60 90 L 50 100 Q 45 110 45 130 L 45 230 Q 45 250 60 260 L 140 260 Q 155 250 155 230 L 155 130 Q 155 110 150 100 L 140 90 Z" fill="url(#g3)"/>

            <!-- Handles -->
            <path d="M 75 90 Q 70 50 100 35 Q 130 50 125 90" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Icon Circle -->
            <circle cx="100" cy="155" r="48" fill="none" stroke="white" stroke-width="5"/>

            <!-- Headset Icon -->
            <g transform="translate(100, 155)">
              <path d="M -32 -4 Q -32 -20 -14 -26 Q 0 -28 14 -26 Q 32 -20 32 -4" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="-24" cy="8" r="12" fill="none" stroke="white" stroke-width="5"/>
              <circle cx="24" cy="8" r="12" fill="none" stroke="white" stroke-width="5"/>
              <path d="M -24 20 Q -24 28 -22 32" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <div class="logo-title">Headset Icon</div>
        <div class="logo-desc">Customer service support</div>
      </div>
    </div>

    <!-- Brand Lockup -->
    <div class="brand-section">
      <h2>Brand Lockup</h2>
      <div class="brand-display">
        <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
          <defs>
            <linearGradient id="gbrand" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#FFA500"/>
              <stop offset="100%" style="stop-color:#FF6B6B"/>
            </linearGradient>
          </defs>
          <!-- Shopping Bag Body -->
          <path d="M 60 90 L 50 100 Q 45 110 45 130 L 45 230 Q 45 250 60 260 L 140 260 Q 155 250 155 230 L 155 130 Q 155 110 150 100 L 140 90 Z" fill="url(#gbrand)"/>
          <!-- Handles -->
          <path d="M 75 90 Q 70 50 100 35 Q 130 50 125 90" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Icon Circle -->
          <circle cx="100" cy="155" r="48" fill="none" stroke="white" stroke-width="5"/>
          <!-- Phone Icon -->
          <g transform="translate(100, 155)">
            <rect x="-24" y="-32" width="48" height="64" rx="6" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="0" cy="-26" r="2" fill="white"/>
            <line x1="-18" y1="-12" x2="18" y2="-12" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="-18" y1="0" x2="18" y2="0" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="brand-name">HelpMeShop</div>
        <div class="brand-tagline">SHOPPING SUPPORT 24/7</div>
      </div>
    </div>
  </div>
</body>
</html>
